<!DOCTYPE html>
<html lang="en">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register Your Team | GEFA Cup 2026</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="hero">

<nav class="navbar">

<div class="logo">

<img src="images/gefa-logo.jpeg" class="logo-img" alt="GEFA Logo">

<div class="logo-text">

<h1>GEFA CUP 2026</h1>

<p>Gunners Eagle Football Academy</p>

</div>

</div>

<ul class="menu">

<li><a href="index.html">Home</a></li>

<li><a href="fixtures.html">Fixtures</a></li>

<li><a href="gallery.html">Gallery</a></li>

<li><a href="contact.html">Contact</a></li>

</ul>

</nav>

<div class="hero-content">

<span class="badge">TEAM REGISTRATION</span>

<h2>Register Your Team</h2>

<h3>GEFA Cup 2026</h3>

<p class="hero-text">

Complete the form below to register your academy for Ghana's premier youth football tournament.

</p>

</div>

</header>
<section class="registration-form">

    <h2>Team Registration Form</h2>

    <form>

        <label>Academy Name</label>
        <input type="text" placeholder="Enter academy name">

        <label>Coach's Full Name</label>
        <input type="text" placeholder="Enter coach's name">

        <label>Phone Number</label>
        <input type="tel" placeholder="Enter phone number">

        <label>Email Address</label>
        <input type="email" placeholder="Enter email address">

        <label>Age Category</label>

        <select>

            <option>Select Age Group</option>
            <option>U8–U10</option>
            <option>U11–U14</option>

        </select>

        <label>Number of Players</label>
        <input type="number" placeholder="Number of players">

        <label>Team Logo (Optional)</label>
        <input type="file">

        <label>Additional Information</label>

        <textarea rows="5" placeholder="Anything you'd like us to know..."></textarea>

        <button type="submit" class="btn">

            Continue Registration →

        </button>

    </form>

</section>

</body>

</html>
