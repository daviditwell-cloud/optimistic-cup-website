</head>

<body>

<header class="hero">

<nav class="navbar">

<div class="logo">

<img src="images/gefa-logo.jpeg" class="logo-img" alt="GEFA Logo">

<div class="logo-text">

<h1>GEFA CUP 2026</h1>

<p>Gunners Eagle Football Academy</p>

</div>

</div>

<ul class="menu">

<li><a href="index.html">Home</a></li>

<div class="hero-content">

<span class="badge">TEAM REGISTRATION</span>
<div class="progress">

    <div class="progress-bar" style="width:33%;"></div>

</div>

<p class="progress-text">

Step 1 of 3

</p>
<h2>Register Your Team</h2>

<h3>GEFA Cup 2026</h3>

<p class="hero-text">

Complete the form below to register your academy for Ghana's premier youth football tournament.

</p>

</div>

</header>
<section class="registration-form">

    <h2>Team Registration Form</h2>

    <form id="registrationForm">

        <label>Academy Name</label>
<input type="text" name="academyName" placeholder="Enter academy name" required>

        <label>Coach's Full Name</label>
<input type="text" name="coachName" placeholder="Enter coach's name" required>

        <label>Phone Number</label>
<input type="tel" name="phone" placeholder="Enter phone number" required>

        <label>Email Address</label>
<input type="email" name="email" placeholder="Enter email address" required>

        <label>Age Category</label>

        <select name="ageCategory" required>

            <option>Select Age Group</option>
            <option>U8–U10</option>
            <option>U11–U14</option>

        </select>

        <label>Number of Players</label>
        <input type="number" name="players" placeholder="Number of players" required>

        <label>Team Logo (Optional)</label>
        <input type="file">

        <label>Additional Information</label>

        <textarea name="additionalInfo" rows="5" placeholder="Anything you'd like us to know..."></textarea>

        <button type="submit" class="btn">

            Continue Registration →

        </button>

    </form>

</section>

<script src="script.js"></script>

</body>

</html>
